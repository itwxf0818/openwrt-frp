name: Update FRP

on:
  schedule:
    # Beijing (UTC+8): 07:00 every day.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      version: ${{ steps.upstream.outputs.version }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream.py
      - if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: candidate
          path: frp/Makefile
          retention-days: 7

  validate:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      candidate: true
    permissions:
      contents: read

  publish:
    needs: [check, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Never publish an update launched from a non-default branch.
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.check.outputs.base }}
      - uses: actions/download-artifact@v8
        with:
          name: candidate
          path: frp
      - name: Commit only after every validation passed
        env:
          VERSION: ${{ needs.check.outputs.version }}
          BASE: ${{ needs.check.outputs.base }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          python3 scripts/check.py
          if test "$(git rev-parse FETCH_HEAD)" = "$BASE"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frp/Makefile
            git commit -m "chore: update FRP to $VERSION"
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            # A retry may follow a successful push but failed release request.
            # Reuse only the immediate successor with the exact validated tree.
            if ! test "$(git rev-parse FETCH_HEAD^)" = "$BASE" || ! git diff --quiet FETCH_HEAD -- .; then
              echo 'Default branch changed during validation. Rerun Update FRP.'; exit 1
            fi
            git add frp/Makefile
            git checkout --detach FETCH_HEAD
          fi
      - uses: actions/download-artifact@v8
        with:
          pattern: packages-*
          path: work/release-input
      - name: Publish validated packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: bash scripts/publish-release.sh work/release-input
