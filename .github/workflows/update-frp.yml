name: Update FRP

on:
  schedule:
    # Beijing (UTC+8): 07:00 every day.
    - cron: '0 23 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-update
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      version: ${{ steps.upstream.outputs.version }}
      base: ${{ steps.base.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: base
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/upstream.py
      - if: steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: candidate
          path: frp/Makefile
          retention-days: 7

  validate:
    needs: check
    if: needs.check.outputs.changed == 'true'
    uses: ./.github/workflows/build.yml
    with:
      candidate: true
    permissions:
      contents: read

  publish:
    needs: [check, validate]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Never publish an update launched from a non-default branch.
    if: github.ref_name == github.event.repository.default_branch
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.check.outputs.base }}
      - uses: actions/download-artifact@v4
        with:
          name: candidate
          path: frp
      - name: Commit only after every validation passed
        env:
          VERSION: ${{ needs.check.outputs.version }}
          BASE: ${{ needs.check.outputs.base }}
          BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          python3 scripts/check.py
          if test "$(git rev-parse FETCH_HEAD)" = "$BASE"; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add frp/Makefile
            git commit -m "chore: update FRP to $VERSION"
            git push origin "HEAD:refs/heads/$BRANCH"
          else
            # A retry may follow a successful push but failed release request.
            # Reuse only the immediate successor with the exact validated tree.
            if ! test "$(git rev-parse FETCH_HEAD^)" = "$BASE" || ! git diff --quiet FETCH_HEAD -- .; then
              echo 'Default branch changed during validation. Rerun Update FRP.'; exit 1
            fi
            git add frp/Makefile
            git checkout --detach FETCH_HEAD
          fi
      - name: Publish the validated source release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}-r1"
          commit=$(git rev-parse HEAD)
          if gh release view "$tag" >/dev/null 2>&1; then
            published=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" --jq '.object.sha')
            test "$published" = "$commit" || { echo 'Existing release points to a different commit.'; exit 1; }
            echo "Release $tag already exists."
            exit 0
          fi
          cat > "$RUNNER_TEMP/frp-release.md" <<EOF
          FRP 核心：**${VERSION}**；软件包：**${VERSION}-r1**。

          自动跟踪上游稳定版本，源码校验、INI/TOML 测试及四组 SDK 构建全部通过后发布。

          这是编译用的源码发布。Source code 压缩包不是刷机固件或可直接安装的软件包。

          [使用说明](https://github.com/$GH_REPO/blob/$tag/README.md) · [本次构建](https://github.com/$GH_REPO/actions/runs/$GITHUB_RUN_ID)
          EOF
          gh release create "$tag" --target "$commit" --title "FRP $tag" --notes-file "$RUNNER_TEMP/frp-release.md" --latest
