name: Build and validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      candidate:
        type: boolean
        default: false
        description: Use the candidate Makefile artifact from this workflow run

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: inputs.candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate
          path: frp
      - name: Static checks and updater regression tests
        run: |
          python3 scripts/check.py
          python3 -m unittest discover -s tests -v
          bash -n scripts/build-sdk.sh
          sh -n frp/files/frpc.init
          sh -n frp/files/frps.init
          for script in frp/files/*.sh; do sh -n "$script"; done
          bash tests/test_init.sh
          bash tests/test_install_feed.sh
          bash tests/test_feed_layout.sh
          shellcheck -s sh -e SC1091,SC2034 frp/files/*.init frp/files/*.sh
          shellcheck scripts/*.sh tests/*.sh
      - name: Verify exact upstream archive
        run: python3 scripts/fetch-source.py
      - uses: actions/setup-go@v7
        with:
          go-version-file: work/source/go.mod
          cache: false
      - name: Build and exercise the native binaries
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
        run: |
          mkdir -p work/bin
          cd work/source
          go build -trimpath -tags noweb -ldflags '-s -w' -o ../bin/frpc ./cmd/frpc
          go build -trimpath -tags noweb -ldflags '-s -w' -o ../bin/frps ./cmd/frps
          cd ../..
          bash tests/test_init.sh work/bin
          python3 scripts/smoke.py work/bin
          python3 scripts/smoke.py work/bin --format ini
      - name: Cross-compile common router CPU families
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOTOOLCHAIN: local
        run: |
          cd work/source
          for arch in amd64 arm64 arm mipsle; do
            mkdir -p ../cross/$arch
            GOARCH=$arch GOARM=7 GOMIPS=softfloat go build -trimpath -tags noweb -ldflags '-s -w' -o ../cross/$arch/ ./cmd/frpc ./cmd/frps
          done

  sdk:
    needs: source
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - distribution: immortalwrt
            target: x86/64
            name: immortalwrt-x86_64
            release: snapshot
          - distribution: immortalwrt
            target: mediatek/filogic
            name: immortalwrt-aarch64
            release: snapshot
          - distribution: openwrt
            target: x86/64
            name: openwrt-x86_64
            release: snapshot
          - distribution: immortalwrt
            target: x86/64
            name: immortalwrt-25.12.2-x86_64
            release: '25.12.2'
          - distribution: immortalwrt
            target: mediatek/filogic
            name: immortalwrt-25.12.2-aarch64
            release: '25.12.2'
          - distribution: immortalwrt
            target: ipq40xx/generic
            name: immortalwrt-25.12.2-armv7
            release: '25.12.2'
          - distribution: immortalwrt
            target: ramips/mt7621
            name: immortalwrt-25.12.2-mipsel
            release: '25.12.2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - if: inputs.candidate
        uses: actions/download-artifact@v4
        with:
          name: candidate
          path: frp
      - name: Install SDK prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev python3 python3-setuptools rsync swig unzip zlib1g-dev file wget curl zstd
      - name: Build both packages with the official SDK
        env:
          DISTRIBUTION: ${{ matrix.distribution }}
          TARGET: ${{ matrix.target }}
          RELEASE: ${{ matrix.release }}
        run: bash scripts/build-sdk.sh "$DISTRIBUTION" "$TARGET" "$RELEASE"
      - uses: actions/upload-artifact@v4
        with:
          name: packages-${{ matrix.name }}
          path: dist/
          if-no-files-found: error
          retention-days: 14
